<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../utils/theme.css">
    <script src="../utils/theme.js"></script>
    <title>Pray Times</title>
</head>

<body>
    <div class="dcontainer">
        <div class="salat">
            <div class="titles">
                <h3 id="previousPrayer">Previous</h3>
                <h3 id="nextPrayer">Next</h3>
            </div>
            <div class="progress" role="progressbar" aria-label="Basic example" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar">Calculating...</div>
            </div>
            <div class="times">
                <h3 id="previous-time">Loading...</h3>
                <h3 id="next-time">Loading...</h3>
            </div>
        </div>
        <div class="date-container">
            <div class="date">
                <div class="btns">
                    <button id="openOptions" class="options-icon-btn" type="button" aria-label="Settings"
                        title="Settings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                    </button>
                    <button id="openSidebar" class="sidebar-btn" type="button" title="Open Prayer Sidebar">
                        <img src="../imgs/icons/sidebar.png" alt="Open Sidebar" class="sidebar-icon">
                    </button>
                </div>
                <h6 id="day">Loading...</h6>
                <h1 id="date">...</h1>
                <h6 id="month">Loading...</h6>
            </div>
        </div>
        <div class="error-card hidden" id="errorCard">
            <p id="errorMessage">No city selected yet. Choose your location in Options to see prayer times.</p>
            <button type="button" id="openOptionsButton" class="options-btn">Choose City</button>
        </div>
    </div>
    <script type="module" src="content.js"></script>
</body>

</html>
